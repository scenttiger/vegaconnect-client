name: build-macos

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [buildest, 'ci/**']

jobs:
  build-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust 1.81 (macOS требует 1.81)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81"
          components: rustfmt

      - name: Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: vcpkg (x64-osx)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_TRIPLET=x64-osx" >> "$GITHUB_ENV"

      - name: brew install nasm (нужен для сборки aom/ffmpeg)
        run: brew install nasm

      - name: "vcpkg install (manifest) — все зависимости из vcpkg.json"
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-osx --x-install-root="$VCPKG_ROOT/installed"

      - name: Patch pubspec for Flutter 3.22.3
        working-directory: flutter
        shell: bash
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: flutter_rust_bridge_codegen 1.80.1
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          # Stabilize git over flaky GH runners: long cargo fetches to
          # github.com routinely die with "HTTP2 framing layer" or
          # "RPC failed; curl 56 Recv failure: Operation timed out".
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          export CARGO_NET_RETRY=10
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          # Prefetch project deps with retry: codegen runs cargo metadata
          # which pulls ~20 git deps and routinely times out on GH runners.
          for i in 1 2 3 4 5; do
            echo "cargo fetch attempt $i"
            if cargo fetch --locked; then break; fi
            echo "retry in 20s..."; sleep 20
          done
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Warm CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos/trunk
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('flutter/macos/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Pre-warm CocoaPods trunk repo (retry)
        run: |
          # cdn.cocoapods.org flakes on GH runners (DNS / HTTP2):
          # "Could not resolve host: cdn.cocoapods.org" during pod install.
          # On cache hit trunk already exists, skip the network entirely.
          if pod repo list 2>/dev/null | grep -qE "^trunk$"; then
            echo "trunk already present (cache hit)"
          else
            for i in 1 2 3 4 5; do
              echo "pod repo add trunk attempt $i"
              if pod repo add trunk https://cdn.cocoapods.org/ 2>&1; then break; fi
              echo "retry in 20s..."; sleep 20
            done
          fi
          pod repo list

      - name: build.py --flutter
        run: |
          # Wrap in retry: pod install inside flutter build macos still
          # touches cdn.cocoapods.org and can flake mid-fetch.
          for i in 1 2 3; do
            echo "build.py --flutter attempt $i"
            if python3 build.py --flutter; then break; fi
            echo "retry in 30s..."; sleep 30
          done

      - name: upload .app (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64
          path: flutter/build/macos/Build/Products/Release/VegaConnect.app
          if-no-files-found: error

  build-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust 1.81
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81"
          components: rustfmt

      - name: Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: vcpkg (arm64-osx)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_TRIPLET=arm64-osx" >> "$GITHUB_ENV"

      - name: brew install nasm (нужен для сборки aom/ffmpeg)
        run: brew install nasm

      - name: "vcpkg install (manifest) — все зависимости из vcpkg.json"
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"

      - name: Patch pubspec for Flutter 3.22.3
        working-directory: flutter
        shell: bash
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: flutter_rust_bridge_codegen 1.80.1
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          # Stabilize git over flaky GH runners: long cargo fetches to
          # github.com routinely die with "HTTP2 framing layer" or
          # "RPC failed; curl 56 Recv failure: Operation timed out".
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          export CARGO_NET_RETRY=10
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          # Prefetch project deps with retry: codegen runs cargo metadata
          # which pulls ~20 git deps and routinely times out on GH runners.
          for i in 1 2 3 4 5; do
            echo "cargo fetch attempt $i"
            if cargo fetch --locked; then break; fi
            echo "retry in 20s..."; sleep 20
          done
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Warm CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos/trunk
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('flutter/macos/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Pre-warm CocoaPods trunk repo (retry)
        run: |
          # cdn.cocoapods.org flakes on GH runners (DNS / HTTP2):
          # "Could not resolve host: cdn.cocoapods.org" during pod install.
          # On cache hit trunk already exists, skip the network entirely.
          if pod repo list 2>/dev/null | grep -qE "^trunk$"; then
            echo "trunk already present (cache hit)"
          else
            for i in 1 2 3 4 5; do
              echo "pod repo add trunk attempt $i"
              if pod repo add trunk https://cdn.cocoapods.org/ 2>&1; then break; fi
              echo "retry in 20s..."; sleep 20
            done
          fi
          pod repo list

      - name: build.py --flutter
        run: |
          # Wrap in retry: pod install inside flutter build macos still
          # touches cdn.cocoapods.org and can flake mid-fetch.
          for i in 1 2 3; do
            echo "build.py --flutter attempt $i"
            if python3 build.py --flutter; then break; fi
            echo "retry in 30s..."; sleep 30
          done

      - name: upload .app (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64
          path: flutter/build/macos/Build/Products/Release/VegaConnect.app
          if-no-files-found: error

  assemble-universal:
    needs: [build-x86_64, build-arm64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: download .app (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: app-x86_64
          path: artifacts/x86_64/VegaConnect.app

      - name: download .app (arm64)
        uses: actions/download-artifact@v4
        with:
          name: app-arm64
          path: artifacts/arm64/VegaConnect.app

      - name: lipo -create главного бинарника
        run: |
          set -euo pipefail
          ARM_APP=artifacts/arm64/VegaConnect.app
          X64_APP=artifacts/x86_64/VegaConnect.app
          OUT=artifacts/universal/VegaConnect.app
          mkdir -p artifacts/universal
          cp -R "$ARM_APP" "$OUT"
          lipo -create \
            "$ARM_APP/Contents/MacOS/VegaConnect" \
            "$X64_APP/Contents/MacOS/VegaConnect" \
            -output "$OUT/Contents/MacOS/VegaConnect"
          lipo -info "$OUT/Contents/MacOS/VegaConnect"
          # Inside-out ad-hoc signing. --deep is deprecated by Apple and
          # fails on some Flutter plugin frameworks with "bundle format is
          # ambiguous (could be app or framework)", e.g. uni_links_desktop.
          if [ -d "$OUT/Contents/Frameworks" ]; then
            for fw in "$OUT/Contents/Frameworks"/*.framework; do
              [ -e "$fw" ] || continue
              fwname=$(basename "$fw" .framework)
              exec_path="$fw/Contents/MacOS/$fwname"
              if [ -f "$exec_path" ]; then
                echo "sign framework exec: $exec_path"
                codesign --force --sign - "$exec_path"
              fi
              echo "sign framework bundle: $fw"
              codesign --force --sign - "$fw" 2>/dev/null || echo "  bundle ambiguous; exec already signed, proceed"
            done
            for dl in "$OUT/Contents/Frameworks"/*.dylib; do
              [ -e "$dl" ] || continue
              echo "sign dylib: $dl"
              codesign --force --sign - "$dl"
            done
          fi
          if [ -d "$OUT/Contents/PlugIns" ]; then
            for ext in "$OUT/Contents/PlugIns"/*.appex; do
              [ -e "$ext" ] || continue
              echo "sign appex: $ext"
              codesign --force --deep --sign - "$ext"
            done
          fi
          if [ -f flutter/macos/Runner/Release.entitlements ]; then
            echo "sign app with entitlements: flutter/macos/Runner/Release.entitlements"
            codesign --force --sign - --entitlements flutter/macos/Runner/Release.entitlements "$OUT"
          else
            echo "WARN: entitlements file not found; signing without entitlements"
            codesign --force --sign - "$OUT"
          fi
          codesign --verify --verbose=2 --no-strict "$OUT"

      - name: create-dmg
        run: |
          brew install create-dmg
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          create-dmg \
            --volname "VegaConnect" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "VegaConnect.app" 200 190 \
            --hide-extension "VegaConnect.app" \
            --app-drop-link 600 185 \
            "artifacts/VegaConnect-${VERSION}-universal.dmg" \
            "artifacts/universal/VegaConnect.app"

      - name: upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-universal
          path: artifacts/*.dmg
          if-no-files-found: error
